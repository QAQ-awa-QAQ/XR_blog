    # ---------- 中转网关（独立端口 8808）----------
    # 所有到达本端口的请求按 Host 认领功能：Go 网关先做会话鉴权与逐功能授权，
    # 再反向代理到功能配置的上游服务（如本机 127.0.0.1:3000 的 CVAT）。
    # 上游服务自身零暴露——未登录 / 无授权只能看到拦截页；
    # 浏览器打开的地址固定为域名，不随局域网 / 穿透等访问方式变化。
    server {
        listen 8808 default_server;
        server_name _;

        set $client_ip $remote_addr;

        # 封禁页 / 冷却页直通 Go 渲染（沿用本端口，避免跳到博客域名）
        location = /banned {
            proxy_pass http://blog_app/banned;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
        }

        location = /cooldown {
            proxy_pass http://blog_app/cooldown;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
        }

        # 闸门自身：internal 保证外部无法直接访问
        location = /api/internal/ipcheck {
            internal;
            proxy_pass              http://blog_app/api/internal/ipcheck;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $client_ip;
            proxy_set_header        X-Forwarded-For   $client_ip;
        }

        location @blocked {
            if ($block_reason = cooldown) {
                return 302 /cooldown;
            }
            if ($block_reason = banned) {
                return 302 /banned;
            }
            return 412;
        }

        location / {
            auth_request     /api/internal/ipcheck;
            auth_request_set $block_reason $upstream_http_x_block;
            error_page       403 = @blocked;

            # 数据集上传等大请求（CVAT 之类），仅本端口放开
            client_max_body_size 2048m;

            # WebSocket / SSE / 长任务
            proxy_http_version 1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection $connection_upgrade;
            proxy_buffering     off;
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # 送给 Go 网关的请求统一加 /_gw 前缀（与博客自身的 /api 路由彻底隔离）
            rewrite ^ /_gw$uri break;
            proxy_pass http://blog_app;
        }
    }
