worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # 注意：这里刻意不使用 limit_req。
    # 4.1/4.2 的阈值判定完全交给 Go 的滑动窗口；若 Nginx 先以 503 拒绝请求，
    # Go 就永远数不到 20 次，"再犯永久封禁"这条规则会直接失效。

    upstream blog_app {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # 容器内的 80 会映射到宿主机任意端口，绝对地址会丢掉端口号把用户带偏，
        # 因此重定向一律输出相对路径。
        absolute_redirect off;

        # 真实客户端 IP。
        # 当前为边缘直连，$remote_addr 就是真实来源，因此只透传不追加 XFF，
        # 避免客户端伪造 X-Forwarded-For 绕过限流。
        # 将来前面若再加一层 Nginx/Cloudflare，只需启用 realip 模块并声明可信网段，
        # 应用侧代码与 TRUSTED_PROXIES 配置即可原样沿用。
        set $client_ip $remote_addr;

        # 封禁页 / 冷却页由 Go 渲染（样式全部内联、零外部资源），
        # 这两个位置必须豁免 auth_request，否则会无限重定向。
        location = /banned {
            proxy_pass http://blog_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /cooldown {
            proxy_pass http://blog_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 闸门自身：internal 保证外部无法直接访问
        location = /api/internal/ipcheck {
            internal;
            proxy_pass              http://blog_app/api/internal/ipcheck;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $client_ip;
            proxy_set_header        X-Forwarded-For   $client_ip;
        }

        # 闸门返回 403 时按 X-Block 头决定去向。
        # error_page 默认只作用于 Nginx 自身产生的错误；上游返回的 403/429
        # （例如 CSRF 失败、登录冷却）会原样透传，不会被误跳进封禁页。
        # 这里再显式检查两个取值，避免"任何 403 都当封禁"的意外行为。
        location @blocked {
            if ($block_reason = cooldown) {
                return 302 /cooldown;
            }
            if ($block_reason = banned) {
                return 302 /banned;
            }
            return 412;
        }

        # ⚠️ 登录 / 注册必须绕开闸门。
        # 这两个接口在冷却期内必须继续被 Go 统计到，否则窗口内永远凑不满 20 次，
        # design.md 4.2 的"再犯永久封禁"就会彻底失效（这个坑实测踩到过）。
        # 它们自身的限流与封禁判定由 Go 的 ipguard 中间件负责：
        #   封禁 → 403 {code:"banned"}，冷却 → 429 {code:"cooldown"} 且仍然计数。
        location = /api/auth/login {
            proxy_pass              http://blog_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $client_ip;
            proxy_set_header        X-Forwarded-For   $client_ip;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location = /api/auth/register {
            proxy_pass              http://blog_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $client_ip;
            proxy_set_header        X-Forwarded-For   $client_ip;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        # 后端接口
        location /api/ {
            auth_request     /api/internal/ipcheck;
            auth_request_set $block_reason $upstream_http_x_block;
            error_page       403 = @blocked;

            proxy_pass              http://blog_app;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $client_ip;
            proxy_set_header        X-Forwarded-For   $client_ip;
            proxy_set_header        X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            access_log off;
            proxy_pass http://blog_app/healthz;
        }

        # 带指纹的静态资源可长期缓存
        location /assets/ {
            auth_request     /api/internal/ipcheck;
            auth_request_set $block_reason $upstream_http_x_block;
            error_page       403 = @blocked;

            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 页面与前端路由：静态资源同样逐请求校验（design.md 4.2）
        location / {
            auth_request     /api/internal/ipcheck;
            auth_request_set $block_reason $upstream_http_x_block;
            error_page       403 = @blocked;

            try_files $uri $uri/ /index.html;
        }
    }
}
