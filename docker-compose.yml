services:
  app:
    build:
      context: .
      args:
        # 容器内直连 proxy.golang.org 常常超时，默认走镜像；网络通畅时可置空
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: xr-personal-blog:latest
    container_name: xr-blog
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      DB_PATH: /data/blog.db
      REDIS_ADDR: redis:6379
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-admin}
      # 留空则冷启动时随机生成密码并打印到容器日志（docker compose logs app）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 明文 HTTP 下必须为 false；一旦挂上 HTTPS 域名就改成 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_PROXIES: 127.0.0.1,::1
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: xr-blog-redis
    restart: unless-stopped
    # 封禁计数与登录会话都在 Redis 里，必须开启 AOF 以免重启丢数据
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  redis-data:
